name: build-test-deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run tests
        run: go test ./...

      - name: Build Docker image
        run: docker build -t go-k8s-demo:ci .

      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ci-cluster

      - name: Load image into Kind
        run: kind load docker-image go-k8s-demo:ci --name ci-cluster

      - name: Deploy and wait
        run: |
          kubectl apply -f k8s/
          kubectl rollout status deployment/go-k8s-demo --timeout=120s

      - name: Smoke test
        run: |
          kubectl port-forward svc/go-k8s-demo 8080:80 &
          sleep 5
          curl -sf http://localhost:8080/healthcheck
