name: build-test-deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32
        with:
          go-version: '1.25'

      - name: Run tests
        run: go test ./...
      
      - name: Vet code
        run: go vet ./...

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || (echo "go.mod or go.summ is out of date. Run 'go mod tidy' locally and commit." && exit 1)

      - name: Build Docker image
        run: docker build -t go-k8s-demo:ci .

      - name: Create Kind cluster
        uses: helm/kind-action@0025e74a8c7512023d06dc019c617aa3cf561fde
        with:
          cluster_name: ci-cluster

      - name: Load image into Kind
        run: kind load docker-image go-k8s-demo:ci --name ci-cluster

      - name: Deploy and wait
        run: |
          kubectl apply -f k8s/
          kubectl rollout status deployment/go-k8s-demo --timeout=120s

      - name: Smoke test
        run: |
          kubectl port-forward svc/go-k8s-demo 8080:80 &
          sleep 5
          curl -sf http://localhost:8080/healthcheck
